apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  namespace: wisecow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wisecow
  template:
    metadata:
      labels:
        app: wisecow
    spec:
      containers:
      - name: wisecow
        image: ghcr.io/gaurav152002/assignment/wisecow:latest
        ports:
        - containerPort: 4499
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"